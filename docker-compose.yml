services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alarm-copilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./rag/documents:/app/rag/documents:ro
      - chroma_data:/app/data/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  chroma_data: